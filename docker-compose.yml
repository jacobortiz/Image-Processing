version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:///./app.db
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_PATH=./storage

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend 